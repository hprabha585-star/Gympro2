<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GymPro — Super Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'DM Sans',sans-serif;background:#F0F5F5;color:#1A2E2E;padding:16px;padding-bottom:40px;-webkit-tap-highlight-color:transparent}
    .container{max-width:700px;margin:0 auto}

    .header{background:linear-gradient(135deg,#1A2E2E,#2D4E4E);border-radius:20px;padding:20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .header-left h1{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:2px}
    .header-left p{font-size:.75rem;color:rgba(255,255,255,.55)}
    .header-right{display:flex;gap:8px;align-items:center}
    .logout-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:10px;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
    .logout-btn:hover{background:rgba(255,255,255,.2)}

    .section{background:#fff;border-radius:18px;margin-bottom:14px;overflow:hidden;border:1px solid #E0ECEC;box-shadow:0 2px 8px rgba(0,0,0,.04)}
    .sec-head{padding:14px 16px;background:#F8FFFE;border-bottom:1.5px solid #E0ECEC;font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:space-between}
    .sec-head-left{display:flex;align-items:center;gap:8px}
    .badge-count{background:#1A8C8C;color:#fff;border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:800}
    .badge-count.red{background:#E74C3C}

    .gym-card{padding:14px 16px;border-bottom:1px solid #F0F5F5}
    .gym-card:last-child{border-bottom:none}
    .gym-info h3{font-size:.95rem;font-weight:800;color:#1A2E2E;margin-bottom:3px}
    .gym-info .gym-meta{font-size:.75rem;color:#8AABAB;margin-top:2px}
    .gym-info .gym-email{font-size:.78rem;color:#4A6464;font-weight:600;margin-top:2px}
    .gym-info .reg-date{font-size:.68rem;color:#B0C4C4;margin-top:4px}
    .btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}

    .limit-field{display:flex;align-items:center;gap:6px;background:#F0F5F5;border-radius:10px;padding:6px 10px}
    .limit-field label{font-size:.68rem;font-weight:700;color:#4A6464;white-space:nowrap}
    .limit-field input{width:70px;padding:6px 8px;border:1.5px solid #E0ECEC;border-radius:7px;font-family:inherit;font-size:.78rem}

    .btn{padding:8px 16px;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:.78rem;cursor:pointer;transition:all .18s}
    .btn:active{transform:scale(.96)}
    .btn-approve{background:#27AE60;color:#fff}
    .btn-reject{background:#E74C3C;color:#fff}
    .btn-ghost{background:#F0F5F5;color:#4A6464;border:1px solid #E0ECEC}
    .btn-sm{padding:6px 12px;font-size:.72rem}
    .btn-warn{background:#FEF9E7;color:#D97706;border:1px solid #FDE68A}
    .btn-delete{background:#fff;color:#E74C3C;border:1.5px solid #FECDD5}
    .btn-delete:hover{background:#FFF0F0}

    .status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:800}
    .s-pending{background:#FEF9E7;color:#D97706}
    .s-active{background:#E8F8EF;color:#27AE60}
    .s-inactive{background:#F3F4F6;color:#6B7280}

    .empty{text-align:center;padding:36px 20px;color:#8AABAB}
    .empty .ei{font-size:2.5rem;margin-bottom:8px}

    .toast{position:fixed;bottom:20px;left:16px;right:16px;max-width:500px;margin:0 auto;
      background:#1A2E2E;color:#fff;padding:13px 16px;border-radius:12px;
      text-align:center;font-weight:700;font-size:.85rem;
      transform:translateY(120px);transition:transform .3s cubic-bezier(.22,1,.36,1);
      z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.2)}
    .toast.show{transform:translateY(0)}
    .toast.success{background:#27AE60}
    .toast.error{background:#E74C3C}

    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
    .modal-bg.open{display:flex}
    .modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:400px}
    .modal h3{font-size:1rem;font-weight:800;margin-bottom:12px;color:#1A2E2E}
    .modal textarea{width:100%;padding:12px;border:2px solid #E0ECEC;border-radius:10px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:80px}
    .modal .modal-btns{display:flex;gap:8px;margin-top:12px}
    .modal .modal-btns button{flex:1}

    .gym-av{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1A8C8C,#156F6F);
      display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;font-weight:800;flex-shrink:0}
    .gym-av-wrap{display:flex;align-items:flex-start;gap:12px}
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <h1>🏆 GymPro Control Panel</h1>
      <p id="saEmail" style="color:rgba(255,255,255,.5);font-size:.72rem"></p>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- 1. Pending Admin (gym owner) Approvals -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-head-left">⏳ Pending Admin Approvals <span class="badge-count red" id="pendingBadge">0</span></div>
      <button class="btn btn-ghost btn-sm" onclick="loadAll()">🔄 Refresh</button>
    </div>
    <div id="pendingList"><div class="empty"><div class="ei">✨</div><p>Loading…</p></div></div>
  </div>

  <!-- 2. Pending Additional-Gym Approvals -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-head-left">🏢 Pending Gym Approvals (Multi-Gym Owners) <span class="badge-count red" id="pendingGymsBadge">0</span></div>
    </div>
    <div id="pendingGymsList"><div class="empty"><div class="ei">✨</div><p>Loading…</p></div></div>
  </div>

  <!-- 3. Pending Admin Password Resets -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-head-left">🔑 Pending Password Resets <span class="badge-count red" id="pendingResetsBadge">0</span></div>
    </div>
    <div id="pendingResetsList"><div class="empty"><div class="ei">✨</div><p>Loading…</p></div></div>
  </div>

  <!-- 4. All Gyms — was missing entirely from this page before; only the
       three pending sections above existed here, so there was nowhere on
       this page to see already-approved gyms or delete one. -->
  <div class="section">
    <div class="sec-head">
      <div class="sec-head-left">🏋️ All Gyms <span class="badge-count" id="allGymsBadge">0</span></div>
    </div>
    <div id="allGymsList"><div class="empty"><div class="ei">✨</div><p>Loading…</p></div></div>
  </div>

</div>

<div class="modal-bg" id="rejectModal">
  <div class="modal">
    <h3 id="rejectModalTitle">❌ Reject Request</h3>
    <p style="font-size:.82rem;color:#8AABAB;margin-bottom:10px">Provide a reason (optional):</p>
    <textarea id="rejectReason" placeholder="e.g. Incomplete information, duplicate registration…"></textarea>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeRejectModal()">Cancel</button>
      <button class="btn btn-reject" onclick="confirmReject()">Confirm Reject</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const BASE = 'https://lightpink-mandrill-900007.hostingersite.com/api';
const hdrs = () => ({ 'Content-Type':'application/json', 'Authorization':`Bearer ${localStorage.getItem('token')}` });
let _rejectTarget = null;

(function() {
  const u = JSON.parse(localStorage.getItem('user') || '{}');
  if (!u || u.role !== 'superadmin') {
    window.location.href = '/login.html';
    return;
  }
  document.getElementById('saEmail').textContent = u.email || '';
})();

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = '/login.html';
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  setTimeout(function() { el.className = 'toast'; }, 3000);
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function fDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function gymAv(name) {
  const i = (name || '?').split(' ').map(function(x) { return x[0]; }).join('').toUpperCase().slice(0, 2);
  const colors = ['#1A8C8C', '#2980B9', '#27AE60', '#8E44AD', '#E67E22', '#E74C3C'];
  const bg = colors[(name || '').charCodeAt(0) % colors.length];
  return '<div class="gym-av" style="background:linear-gradient(135deg,' + bg + ',' + bg + 'CC)">' + esc(i) + '</div>';
}

async function loadAll() {
  await Promise.all([ loadPending(), loadPendingGyms(), loadPendingResets(), loadAllGyms() ]);
}

/* ── Pending admin (gym owner) approvals ─────────────────────────── */
async function loadPending() {
  try {
    const res = await fetch(BASE + '/auth/pending-approvals', { headers: hdrs() });
    if (res.status === 401) { logout(); return; }
    const list = await res.json();

    document.getElementById('pendingBadge').textContent = list.length;
    const el = document.getElementById('pendingList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="ei">✅</div><p>No pending approvals</p></div>';
      return;
    }

    el.innerHTML = list.map(function(u) {
      return '<div class="gym-card">' +
        '<div class="gym-av-wrap">' +
          gymAv(u.gymName || u.name) +
          '<div class="gym-info" style="flex:1;min-width:0">' +
            '<h3>' + esc(u.gymName || u.name) + '\'s Gym</h3>' +
            '<div class="gym-email">👤 ' + esc(u.name) + ' &nbsp;|&nbsp; ✉️ ' + esc(u.email) + '</div>' +
            '<div class="reg-date">📅 Registered: ' + fDate(u.createdAt) + '</div>' +
            '<span class="status s-pending" style="margin-top:6px;display:inline-block">⏳ Awaiting Approval</span>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<div class="limit-field">' +
            '<label>👥 Limit</label>' +
            '<input type="number" id="limit-admin-' + esc(String(u._id)) + '" placeholder="∞" min="0">' +
          '</div>' +
          '<button class="btn btn-approve" onclick="approveAdmin(\'' + esc(String(u._id)) + '\',\'' + esc(u.gymName || u.name) + '\')">✅ Approve</button>' +
          '<button class="btn btn-reject" onclick="openRejectModal(\'admin\',\'' + esc(String(u._id)) + '\')">❌ Reject</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('pendingList').innerHTML = '<div class="empty"><p style="color:#E74C3C">Error loading</p></div>';
  }
}

async function approveAdmin(userId, gymName) {
  const limitInput = document.getElementById('limit-admin-' + userId);
  const limitVal = (limitInput && limitInput.value.trim() !== '') ? Number(limitInput.value) : null;
  try {
    const res = await fetch(BASE + '/auth/approve/' + userId, {
      method: 'POST', headers: hdrs(),
      body: JSON.stringify({ memberLimit: limitVal })
    });
    const data = await res.json();
    if (res.ok) {
      toast('✅ ' + gymName + ' approved' + (limitVal ? (' — limit: ' + limitVal + ' members') : ''), 'success');
      loadAll();
    } else {
      toast(data.error || 'Approval failed', 'error');
    }
  } catch (e) { toast('Network error', 'error'); }
}

/* ── Pending additional-gym approvals ────────────────────────────── */
async function loadPendingGyms() {
  try {
    const res = await fetch(BASE + '/admin/pending-gyms', { headers: hdrs() });
    if (res.status === 401) { logout(); return; }
    const list = await res.json();

    document.getElementById('pendingGymsBadge').textContent = list.length;
    const el = document.getElementById('pendingGymsList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="ei">✅</div><p>No pending gym requests</p></div>';
      return;
    }

    el.innerHTML = list.map(function(g) {
      const ownerName = (g.User && g.User.name) || '';
      const ownerEmail = (g.User && g.User.email) || '';
      const ownerGym = (g.User && g.User.gymName) || '';
      return '<div class="gym-card">' +
        '<div class="gym-av-wrap">' +
          gymAv(g.name) +
          '<div class="gym-info" style="flex:1;min-width:0">' +
            '<h3>' + esc(g.name) + '</h3>' +
            '<div class="gym-email">👤 Owner: ' + esc(ownerName) + ' &nbsp;|&nbsp; ✉️ ' + esc(ownerEmail) + '</div>' +
            '<div class="gym-meta">Already owns: ' + esc(ownerGym) + '</div>' +
            '<div class="reg-date">📅 Requested: ' + fDate(g.createdAt) + '</div>' +
            '<span class="status s-pending" style="margin-top:6px;display:inline-block">⏳ Awaiting Approval</span>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<div class="limit-field">' +
            '<label>👥 Limit</label>' +
            '<input type="number" id="limit-gym-' + esc(String(g.id)) + '" placeholder="∞" min="0">' +
          '</div>' +
          '<button class="btn btn-approve" onclick="approveExtraGym(\'' + esc(String(g.id)) + '\',\'' + esc(g.name) + '\')">✅ Approve</button>' +
          '<button class="btn btn-reject" onclick="openRejectModal(\'gym\',\'' + esc(String(g.id)) + '\')">❌ Reject</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('pendingGymsList').innerHTML = '<div class="empty"><p style="color:#E74C3C">Error loading</p></div>';
  }
}

async function approveExtraGym(gymId, name) {
  const limitInput = document.getElementById('limit-gym-' + gymId);
  const limitVal = (limitInput && limitInput.value.trim() !== '') ? Number(limitInput.value) : null;
  try {
    const res = await fetch(BASE + '/admin/approve-gym/' + gymId, {
      method: 'POST', headers: hdrs(),
      body: JSON.stringify({ memberLimit: limitVal })
    });
    const data = await res.json();
    if (res.ok) {
      toast(data.message || (name + ' approved' + (limitVal ? (' — limit: ' + limitVal + ' members') : '')), 'success');
      loadAll();
    } else {
      toast(data.error || 'Failed to approve', 'error');
    }
  } catch (e) { toast('Network error', 'error'); }
}

/* ── Pending password resets ─────────────────────────────────────── */
async function loadPendingResets() {
  try {
    const res = await fetch(BASE + '/auth/pending-password-resets', { headers: hdrs() });
    if (res.status === 401) { logout(); return; }
    const list = await res.json();

    document.getElementById('pendingResetsBadge').textContent = list.length;
    const el = document.getElementById('pendingResetsList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="ei">✅</div><p>No pending password resets</p></div>';
      return;
    }

    el.innerHTML = list.map(function(u) {
      return '<div class="gym-card">' +
        '<div class="gym-av-wrap">' +
          gymAv(u.gymName || u.name) +
          '<div class="gym-info" style="flex:1;min-width:0">' +
            '<h3>' + esc(u.gymName || u.name) + '</h3>' +
            '<div class="gym-email">👤 ' + esc(u.name) + ' &nbsp;|&nbsp; ✉️ ' + esc(u.email) + '</div>' +
            '<div class="reg-date">📅 Requested: ' + fDate(u.resetRequestedAt) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<div class="limit-field" style="flex:1;min-width:160px">' +
            '<label>🔑 New pwd</label>' +
            '<input type="text" id="newpwd-' + esc(String(u._id)) + '" placeholder="6+ characters" style="width:100%">' +
          '</div>' +
          '<button class="btn btn-approve" onclick="approvePasswordReset(\'' + esc(String(u._id)) + '\',\'' + esc(u.name) + '\')">✅ Set & Approve</button>' +
          '<button class="btn btn-reject" onclick="rejectPasswordReset(\'' + esc(String(u._id)) + '\',\'' + esc(u.name) + '\')">❌ Dismiss</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('pendingResetsList').innerHTML = '<div class="empty"><p style="color:#E74C3C">Error loading</p></div>';
  }
}

async function approvePasswordReset(userId, name) {
  const pwdInput = document.getElementById('newpwd-' + userId);
  const newPassword = pwdInput ? pwdInput.value.trim() : '';
  if (!newPassword || newPassword.length < 6) { toast('Enter a password (6+ characters) first', 'error'); return; }
  try {
    const res = await fetch(BASE + '/auth/approve-password-reset/' + userId, {
      method: 'POST', headers: hdrs(), body: JSON.stringify({ newPassword: newPassword })
    });
    const data = await res.json();
    if (res.ok) { toast(data.message || ('Password reset for ' + name), 'success'); loadPendingResets(); }
    else { toast(data.error || 'Failed', 'error'); }
  } catch (e) { toast('Network error', 'error'); }
}

async function rejectPasswordReset(userId, name) {
  try {
    const res = await fetch(BASE + '/auth/reject-password-reset/' + userId, { method: 'POST', headers: hdrs() });
    const data = await res.json();
    if (res.ok) { toast(data.message || 'Dismissed', 'success'); loadPendingResets(); }
    else { toast(data.error || 'Failed', 'error'); }
  } catch (e) { toast('Network error', 'error'); }
}

/* ── All Gyms — list, member-limit edit, suspend/activate, delete ───
   NEW: this whole block was missing from superadmin.html. The backend
   routes it calls already existed in admin.js (GET /admin/gyms,
   PATCH /admin/gym/:id/member-limit, PATCH /admin/gym/:id/toggle,
   DELETE /admin/gym/:id) — nothing on the server needed to change. */
async function loadAllGyms() {
  try {
    const res = await fetch(BASE + '/admin/gyms', { headers: hdrs() });
    if (res.status === 401) { logout(); return; }
    const list = await res.json();

    document.getElementById('allGymsBadge').textContent = list.length;
    const el = document.getElementById('allGymsList');
    if (!list.length) {
      el.innerHTML = '<div class="empty"><div class="ei">🏋️</div><p>No approved gyms yet</p></div>';
      return;
    }

    el.innerHTML = list.map(function(g) {
      const statusBadge = g.isActive
        ? '<span class="status s-active">✓ Active</span>'
        : '<span class="status s-inactive">⏸ Suspended</span>';
      const limitLabel = g.memberLimit ? (g.memberLimit + ' members') : 'Unlimited';
      return '<div class="gym-card">' +
        '<div class="gym-av-wrap">' +
          gymAv(g.gymName || g.name) +
          '<div class="gym-info" style="flex:1;min-width:0">' +
            '<h3>' + esc(g.gymName || g.name) + '</h3>' +
            '<div class="gym-email">👤 ' + esc(g.name) + ' &nbsp;|&nbsp; ✉️ ' + esc(g.email) + '</div>' +
            '<div class="gym-meta">👥 Limit: ' + esc(limitLabel) + ' &nbsp;|&nbsp; ' + statusBadge + '</div>' +
            '<div class="reg-date">📅 Since: ' + fDate(g.createdAt) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="btn-row">' +
          '<div class="limit-field">' +
            '<label>👥 Limit</label>' +
            '<input type="number" id="alllimit-' + esc(String(g._id)) + '" placeholder="∞" min="0" value="' + (g.memberLimit || '') + '">' +
          '</div>' +
          '<button class="btn btn-ghost btn-sm" onclick="updateGymLimit(\'' + esc(String(g._id)) + '\',\'' + esc(g.gymName || g.name) + '\')">💾 Save Limit</button>' +
          '<button class="btn ' + (g.isActive ? 'btn-warn' : 'btn-approve') + ' btn-sm" onclick="toggleGym(\'' + esc(String(g._id)) + '\',\'' + esc(g.gymName || g.name) + '\')">' +
            (g.isActive ? '⏸ Suspend' : '▶ Activate') +
          '</button>' +
          '<button class="btn btn-delete btn-sm" onclick="deleteGym(\'' + esc(String(g._id)) + '\',\'' + esc(g.gymName || g.name) + '\')">🗑️ Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    document.getElementById('allGymsList').innerHTML = '<div class="empty"><p style="color:#E74C3C">Error loading</p></div>';
  }
}

async function updateGymLimit(gymId, name) {
  const input = document.getElementById('alllimit-' + gymId);
  const limitVal = (input && input.value.trim() !== '') ? Number(input.value) : null;
  try {
    const res = await fetch(BASE + '/admin/gym/' + gymId + '/member-limit', {
      method: 'PATCH', headers: hdrs(), body: JSON.stringify({ limit: limitVal })
    });
    const data = await res.json();
    if (res.ok) { toast(data.message || (name + ' limit updated'), 'success'); loadAllGyms(); }
    else { toast(data.error || 'Failed to update limit', 'error'); }
  } catch (e) { toast('Network error', 'error'); }
}

async function toggleGym(gymId, name) {
  try {
    const res = await fetch(BASE + '/admin/gym/' + gymId + '/toggle', { method: 'PATCH', headers: hdrs() });
    const data = await res.json();
    if (res.ok) { toast(data.message || (name + ' status updated'), 'success'); loadAllGyms(); }
    else { toast(data.error || 'Failed', 'error'); }
  } catch (e) { toast('Network error', 'error'); }
}

async function deleteGym(gymId, name) {
  if (!confirm('Permanently delete "' + name + '"? This removes the gym owner account and all of its staff accounts. This cannot be undone.')) return;
  try {
    const res = await fetch(BASE + '/admin/gym/' + gymId, { method: 'DELETE', headers: hdrs() });
    const data = await res.json();
    if (res.ok) { toast(data.message || (name + ' removed'), 'success'); loadAllGyms(); }
    else { toast(data.error || 'Failed to delete', 'error'); }
  } catch (e) { toast('Network error', 'error'); }
}

/* ── Reject modal (shared by admin + gym rejections) ─────────────── */
function openRejectModal(kind, id) {
  _rejectTarget = { kind: kind, id: id };
  document.getElementById('rejectModalTitle').textContent =
    kind === 'admin' ? '❌ Reject Gym Owner Registration' : '❌ Reject Additional Gym Request';
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectModal').classList.add('open');
}
function closeRejectModal() {
  document.getElementById('rejectModal').classList.remove('open');
  _rejectTarget = null;
}
async function confirmReject() {
  if (!_rejectTarget) return;
  const reason = document.getElementById('rejectReason').value.trim() || 'Not approved.';
  const url = _rejectTarget.kind === 'admin'
    ? (BASE + '/auth/reject/' + _rejectTarget.id)
    : (BASE + '/admin/reject-gym/' + _rejectTarget.id);
  try {
    const res = await fetch(url, { method: 'POST', headers: hdrs(), body: JSON.stringify({ reason: reason }) });
    const data = await res.json();
    if (res.ok) {
      toast('Request rejected', 'success');
      closeRejectModal();
      loadAll();
    } else {
      toast(data.error || 'Failed', 'error');
    }
  } catch (e) { toast('Network error', 'error'); }
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
